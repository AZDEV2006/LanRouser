<section class="overview" aria-label="Network summary">
  <div class="metric">
    <span class="metric-label">Registered</span>
    <strong class="metric-value" id="registeredCount">0</strong>
    <span class="metric-note">saved devices</span>
  </div>
  <div class="metric">
    <span class="metric-label">Online</span>
    <strong class="metric-value" id="onlineCount">0</strong>
    <span class="metric-note">confirmed by ping</span>
  </div>
  <div class="metric">
    <span class="metric-label">Discovered</span>
    <strong class="metric-value" id="discoveredCount">--</strong>
    <span class="metric-note">this scan</span>
  </div>
  <div class="metric metric-scan">
    <div class="metric-scan-copy">
      <span class="metric-label">Last network scan</span>
      <div class="metric-value" id="lastScan">Not scanned yet</div>
      <div class="metric-note">Scan results are temporary until registered</div>
    </div>
    <span class="panel-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="8.5" />
        <path d="M3.8 12h16.4M12 3.5a14 14 0 0 1 0 17m0-17a14 14 0 0 0 0 17" />
      </svg>
    </span>
  </div>
</section>
